swagger: "2.0"
info:
  title: payments-api
  description: API Gateway config for Cloud Run payments service
  version: "1.0.0"

schemes:
  - https

consumes:
  - application/json

produces:
  - application/json

x-google-backend:
  address: https://payments-api-207519926302.us-central1.run.app

securityDefinitions:
  ecr_jwt:
    type: oauth2
    flow: implicit
    authorizationUrl: ""
    scopes: {}
    x-google-issuer: payments-api-dev
    x-google-audiences: payments-api-dev
    x-google-jwks_uri: https://payments-api-207519926302.us-central1.run.app/.well-known/jwks.json

security:
  - ecr_jwt: []

paths:
  /auth/token:
    post:
      operationId: createToken
      summary: Authenticate an ECR and issue an access token
      description: Exchange enabled ECR credentials for a 900-second RS256 JWT.
      security: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/TokenRequest"
      responses:
        "200":
          description: Access token issued
          headers:
            Cache-Control:
              type: string
              description: Always no-store.
          schema:
            $ref: "#/definitions/TokenResponse"
        "401":
          description: Invalid credentials, including unknown or disabled ECRs
          schema:
            $ref: "#/definitions/TokenErrorResponse"
        "422":
          description: Invalid token request; submitted values are not returned
          schema:
            $ref: "#/definitions/TokenErrorResponse"
        "503":
          description: Authentication service unavailable; no token is returned
          schema:
            $ref: "#/definitions/TokenErrorResponse"

  /.well-known/jwks.json:
    get:
      operationId: getEcrJwks
      summary: Get the public ECR JWT signing key
      security: []
      responses:
        "200":
          description: Public signing key set
          schema:
            $ref: "#/definitions/JwksResponse"
        "503":
          description: Signing public key unavailable
          schema:
            $ref: "#/definitions/TokenErrorResponse"

  /health:
    get:
      operationId: healthCheck
      summary: Health check
      security: []
      responses:
        "200":
          description: OK

  /payments/{payment_id}:
    get:
      operationId: getPayment
      summary: Get payment by ID
      parameters:
        - name: payment_id
          in: path
          required: true
          type: string
      responses:
        "200":
          description: Payment found
        "404":
          description: Payment not found

  /payments/pay:
    post:
      operationId: createPayment
      summary: Create payment
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/PayRequest"
      responses:
        "200":
          description: Payment created
          schema:
            $ref: "#/definitions/PayResponse"

  /payments/gift:
    post:
      operationId: createGiftPayment
      summary: Create gift payment
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/GiftPaymentRequest"
      responses:
        "200":
          description: Gift payment created
          schema:
            $ref: "#/definitions/GiftPaymentResponse"
        "422":
          description: Validation error

  /terminals/{terminal_id}/batch-sync:
    post:
      operationId: batchSyncTerminalSettlement
      summary: Batch sync approved payments to settled
      parameters:
        - name: terminal_id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/BatchSyncRequest"
      responses:
        "200":
          description: Batch sync result
          schema:
            $ref: "#/definitions/BatchSyncResponse"
        "400":
          description: Bad request
        "500":
          description: Internal server error

  /payments/{payment_id}/events:
    post:
      operationId: postPaymentEvent
      summary: Post payment event and update state
      parameters:
        - name: payment_id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/PaymentEventRequest"
      responses:
        "200":
          description: Event applied
        "404":
          description: Payment not found
        "409":
          description: Invalid transition

  /payments/{payment_id}/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel an in-progress payment
      parameters:
        - name: payment_id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/CancelRequest"
      responses:
        "200":
          description: Cancel requested
        "404":
          description: Payment not found
        "409":
          description: Invalid state
        "500":
          description: Internal server error

  /payments/{payment_id}/void:
    post:
      operationId: voidPayment
      summary: Void an approved payment
      parameters:
        - name: payment_id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/VoidRequest"
      responses:
        "200":
          description: Void requested
        "404":
          description: Payment not found
        "409":
          description: Invalid state
        "500":
          description: Internal server error

  /payments/{payment_id}/return:
    post:
      operationId: returnPayment
      summary: Return a settled payment
      parameters:
        - name: payment_id
          in: path
          required: true
          type: string
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/ReturnRequest"
      responses:
        "200":
          description: Return requested
          schema:
            $ref: "#/definitions/ReturnResponse"
        "404":
          description: Payment not found
        "409":
          description: Invalid state
        "500":
          description: Internal server error

definitions:
  RsaJsonWebKey:
    type: object
    required:
      - kty
      - use
      - alg
      - kid
      - n
      - e
    properties:
      kty:
        type: string
        enum: [RSA]
      use:
        type: string
        enum: [sig]
      alg:
        type: string
        enum: [RS256]
      kid:
        type: string
      n:
        type: string
        description: Base64url-encoded RSA modulus, without padding.
      e:
        type: string
        description: Base64url-encoded RSA exponent, without padding.

  JwksResponse:
    type: object
    required:
      - keys
    properties:
      keys:
        type: array
        items:
          $ref: "#/definitions/RsaJsonWebKey"

  TokenRequest:
    type: object
    additionalProperties: false
    required:
      - username
      - password
    properties:
      username:
        type: string
        minLength: 1
        description: The register's ecr_id.
      password:
        type: string
        format: password
        minLength: 1

  TokenResponse:
    type: object
    required:
      - access_token
      - token_type
      - expires_in
    properties:
      access_token:
        type: string
        description: RS256 JWT signed by Cloud KMS.
      token_type:
        type: string
        enum:
          - Bearer
      expires_in:
        type: integer
        minimum: 900
        maximum: 900
        description: Token lifetime in seconds.

  TokenErrorResponse:
    type: object
    required:
      - detail
    properties:
      detail:
        type: string
        description: Generic error message without credentials or tokens.

  PayRequest:
    type: object
    required:
      - merchant_id
      - store_id
      - terminal_id
      - ecr_reference_number
      - invoice_id
      - amount
      - idempotency_key
    properties:
      merchant_id:
        type: string
      store_id:
        type: string
      terminal_id:
        type: string
      ecr_reference_number:
        type: string
      invoice_id:
        type: string
      amount:
        type: number
        format: double
      idempotency_key:
        type: string

  PayResponse:
    type: object
    properties:
      payment_id:
        type: string
      status:
        type: string

  GiftPaymentRequest:
    type: object
    required:
      - merchant_id
      - store_id
      - terminal_id
      - ecr_reference_number
      - type
      - invoice_id
      - clerk_id
      - idempotency_key
    properties:
      merchant_id:
        type: string
      store_id:
        type: string
      terminal_id:
        type: string
      ecr_reference_number:
        type: string
      type:
        type: string
        enum:
          - SALE
          - ACTIVATE
          - redeem
          - inquiry
      amount:
        type: integer
        format: int64
        description: Required for SALE, ACTIVATE, and redeem. Must be omitted for inquiry.
      invoice_id:
        type: string
      clerk_id:
        type: string
      idempotency_key:
        type: string

  GiftPaymentResponse:
    type: object
    properties:
      payment_id:
        type: string
      type:
        type: string
        enum:
          - SALE
          - ACTIVATE
          - redeem
          - inquiry
      operation:
        type: string
        enum:
          - GIFT
      status:
        type: string

  BatchSyncRequest:
    type: object
    required:
      - settlement_date
      - batch_number
    properties:
      settlement_date:
        type: string
        format: date-time
      batch_number:
        type: string

  BatchSyncResponse:
    type: object
    properties:
      settlement_date:
        type: string
        format: date-time
      batch_number:
        type: string
      total_candidates:
        type: integer
      updated_count:
        type: integer
      skipped_count:
        type: integer

  PaymentEventRequest:
    type: object
    required:
      - event_type
      - status
    properties:
      event_type:
        type: string
      status:
        type: string
      message:
        type: string
      ecr_reference_number:
        type: string
      terminal_reference_number:
        type: string
      host_reference_number: 
        type: string
      last4:
        type: string
        minLength: 4
        maxLength: 4
      balance_cents:
        type: integer
        format: int64
        description: Remaining gift card balance in cents.
      meta:
        type: object
        additionalProperties: true

  CancelRequest:
    type: object
    properties:
      reason:
        type: string
      requested_by:
        type: string
      idempotency_key:
        type: string

  VoidRequest:
    type: object
    properties:
      reason:
        type: string
      requested_by:
        type: string
      idempotency_key:
        type: string

  ReturnRequest:
    type: object
    required:
      - ecr_reference_number
    properties:
      ecr_reference_number:
        type: string
      reason:
        type: string
      requested_by:
        type: string
      idempotency_key:
        type: string

  ReturnResponse:
    type: object
    properties:
      payment_id:
        type: string
      return_requested:
        type: boolean
      status:
        type: string
